<a class="nn-card" href="{:mac_url_vod_detail($vo)}" title="{$vo.vod_name}">
  <span class="nn-poster"><img src="{:mac_url_img($vo.vod_pic)}" alt="{$vo.vod_name}" loading="lazy" decoding="async" width="300" height="420">
    {if condition="$vo.vod_remarks"}<span class="nn-badge nn-badge-bl">{$vo.vod_remarks}</span>{/if}
    {if condition="$vo.vod_score gt 0"}<span class="nn-badge nn-badge-score">{$vo.vod_score}</span>{/if}
    {if condition="$vo.vod_version"}<span class="nn-badge nn-badge-tl">{$vo.vod_version}</span>{/if}
    <span class="nn-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
  </span>
  <span class="nn-card-name">{$vo.vod_name}</span>
  <span class="nn-card-sub">{$vo.vod_year|default=''}{if condition="$vo.vod_year AND $vo.type_name"} · {/if}{$vo.type_name|default=''}</span>
</a>
