<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注册会员 - {$maccms.site_name}</title>
<meta name="keywords" content="{$maccms.site_keywords}">
<meta name="description" content="{$maccms.site_description}">
{include file="public/assets.html" /}
</head>
<body class="page-auth">
{include file="public/header.html" /}
<div class="nn-main">
  <div class="container">
    <div class="nn-center">
      <div class="nn-panel">
        <div class="nn-center-head"><span class="nn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="8" width="18" height="13" rx="1"/><path d="M12 8v13M3 12h18M12 8S10 3 7.5 4 9 8 12 8zm0 0s2-5 4.5-4S15 8 12 8z"/></svg></span><h1>注册会员</h1><p>注册即送积分，收藏与记录多端同步</p></div>
        <form class="nn-form" id="reg-form" action="{:mac_url('user/reg')}" data-redirect="{:mac_url('user/index')}" method="post">
          <div class="alert d-none"></div>
          <input type="hidden" name="uid" value="{$param.uid|default=''}">
          <div><label class="form-label" for="r-u">账号</label><input id="r-u" type="text" name="user_name" class="form-control" placeholder="3-20 位字母或数字" required autocomplete="username" maxlength="20"></div>
          <div class="nn-form-2">
            <div><label class="form-label" for="r-p">密码</label><input id="r-p" type="password" name="user_pwd" class="form-control" placeholder="至少 6 位" required autocomplete="new-password" maxlength="128"></div>
            <div><label class="form-label" for="r-p2">确认密码</label><input id="r-p2" type="password" name="user_pwd2" class="form-control" placeholder="再次输入" required autocomplete="new-password" maxlength="128"></div>
          </div>
          <div><label class="form-label" for="r-e">邮箱</label><input id="r-e" type="email" name="user_email" class="form-control" placeholder="用于找回密码" autocomplete="email" maxlength="50"></div>
          <div><label class="form-label" for="r-v">验证码</label><div class="captcha-line"><input id="r-v" type="text" name="verify" class="form-control" placeholder="验证码" maxlength="5" autocomplete="off"><img class="captcha-img" src="{$maccms.path}index.php/verify/index.html" alt="验证码，点击刷新" width="100" height="44"></div></div>
          <button type="submit" class="nn-btn">立即注册</button>
          <div style="text-align:center;font-size:13px"><a href="{:mac_url('user/login')}" style="color:var(--brand)">已有账号？去登录</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
{include file="public/footer.html" /}
</body>
</html>
