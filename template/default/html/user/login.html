<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>会员登录 - {$maccms.site_name}</title>
<meta name="keywords" content="{$maccms.site_keywords}">
<meta name="description" content="{$maccms.site_description}">
{include file="public/assets.html" /}
</head>
<body class="page-auth">
{include file="public/header.html" /}
<div class="nn-main">
  <div class="container">
    <div class="nn-center">
      <div class="nn-panel">
        <div class="nn-center-head"><span class="nn-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span><h1>会员登录</h1><p>登录后可同步播放记录、收藏与积分</p></div>
        <form class="nn-form" id="login-form" action="{:mac_url('user/login')}" data-redirect="{:mac_url('user/index')}" method="post">
          <div class="alert d-none"></div>
          <div><label class="form-label" for="l-u">账号</label><input id="l-u" type="text" name="user_name" class="form-control" placeholder="用户名 / 邮箱 / 手机号" required autocomplete="username" maxlength="50"></div>
          <div><label class="form-label" for="l-p">密码</label><input id="l-p" type="password" name="user_pwd" class="form-control" placeholder="请输入密码" required autocomplete="current-password" maxlength="128"></div>
          {if condition="$maccms.user_login_verify eq 1"}
          <div><label class="form-label" for="l-v">验证码</label><div class="captcha-line"><input id="l-v" type="text" name="verify" class="form-control" placeholder="验证码" maxlength="5" required autocomplete="off"><img class="captcha-img" src="{$maccms.path}index.php/verify/index.html" alt="验证码，点击刷新" width="100" height="44"></div></div>
          {/if}
          <button type="submit" class="nn-btn">登录</button>
          <div style="display:flex;justify-content:space-between;font-size:13px"><a href="{:mac_url('user/reg')}" style="color:var(--brand)">注册新账号</a><a href="{:mac_url('user/findpass')}" class="nn-muted">忘记密码？</a></div>
        </form>
      </div>
    </div>
  </div>
</div>
{include file="public/footer.html" /}
</body>
</html>
